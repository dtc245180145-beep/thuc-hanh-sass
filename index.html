
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành SASS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <h1>Thực hành SASS</h1>
        <p>Biên dịch SCSS sang CSS bằng SASS CLI</p>
    </header>

    <main class="container">
        <div class="card">
            <h2>Giới thiệu SASS</h2>
            <p>
                SASS giúp viết CSS dễ quản lý hơn bằng biến,
                quy tắc lồng nhau và khả năng tái sử dụng mã.
            </p>
            <a href="https://sass-lang.com/">Tìm hiểu SASS</a>
        </div>

        <div class="card">
            <h2>Biên dịch SCSS</h2>
            <p>
                Sau khi biên dịch, trình duyệt sử dụng file CSS
                được tạo ra từ mã SCSS.
            </p>
            <button class="button" type="button">
                Hoàn thành
            </button>
        </div>
    </main>

</body>
</html>
